# Everyday grade -> learn -> guess at 04:30 US/Eastern, replacing the hand-typed
#   RUN_MODE=daily SHARDS=1 WATCHDOG_SEC=3600 bash scripts/launch.sh
# The runner only orchestrates — the work happens on a RunPod pod, exactly as when launch.sh is
# run from the Mac — then it stays to reap the pod (scripts/reap_pods.sh), which is what the laptop
# used to do.
#
# SETUP: one repository secret, RESEARCHGATEEOD_ENV = the full contents of .env
#   (Settings -> Secrets and variables -> Actions -> New repository secret).
#
# Cron is UTC and has no DST, so both offsets are scheduled and the `gate` step lets through only
# the one that is 04:30 in New York today (EDT = UTC-4 -> 08:30 UTC, EST = UTC-5 -> 09:30 UTC).
# Checking the offset rather than the clock keeps a late-started run (GitHub queues scheduled
# jobs, sometimes 10-30 min) from being skipped. The bars come from DataAcquistion's 00:00 ET
# daily-fetch; if they are not on the volume yet, `preflight` skips without placing a pod.
name: daily-run

on:
  schedule:
    - cron: "30 8 * * *"    # 04:30 EDT (summer)
    - cron: "30 9 * * *"    # 04:30 EST (winter)
  workflow_dispatch:         # manual run from the Actions tab

# Never two dailies at once: both would write the same latest/.
concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    # A daily is ~1 min of compute; the slow parts are placing a pod and the reaper's wait.
    # WATCHDOG_SEC=3600 kills the pod's run at 1 h, so 90 min covers placement + reaping.
    timeout-minutes: 90
    steps:
      - name: gate (04:30 New York only)
        id: gate
        run: |
          case "${{ github.event.schedule }}" in
            "30 8 * * *") want="-0400" ;;
            "30 9 * * *") want="-0500" ;;
            *)            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;   # workflow_dispatch
          esac
          now="$(TZ=America/New_York date +%z)"
          if [ "$now" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "New York is UTC$now today; this is the UTC$want schedule — skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: write .env
        if: steps.gate.outputs.run == 'true'
        env:
          RESEARCHGATEEOD_ENV: ${{ secrets.RESEARCHGATEEOD_ENV }}
        run: |
          [ -n "$RESEARCHGATEEOD_ENV" ] || { echo "::error::secret RESEARCHGATEEOD_ENV is not set"; exit 1; }
          printf '%s\n' "$RESEARCHGATEEOD_ENV" > .env
          chmod 600 .env
          # GitHub masks a secret only as a whole string. Register every individual value so no
          # key can leak line by line.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              [A-Za-z_]*=?*)
                v="${line#*=}"; v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"
                # >= 8 chars: every key/id qualifies; short values like RUNPOD_VCPU=16 would just
                # turn every "16" in the log into ***.
                [ "${#v}" -ge 8 ] && echo "::add-mask::$v" ;;
            esac
          done < .env

      - name: install pyarrow (preflight reads next_session.parquet)
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet pyarrow

      # The checks /daily-run does by hand before launching (steps 1-2 of the skill):
      #   no stored prediction        -> fail: a /quarterly-backtest is needed first
      #   fewer rows than the universe -> fail: a limited run overwrote latest/, restore via src.merge
      #   newest bar not past as_of    -> skip: the vendor has not published yet, a pod would no-op
      - name: preflight
        if: steps.gate.outputs.run == 'true'
        id: pre
        run: |
          set +e; . scripts/_common.sh; set +e
          W="$RUNNER_TEMP/pre"; mkdir -p "$W"
          for t in AAPL MSFT AVGO; do
            aws s3 cp $S3FLAGS "$SRC_BUCKET/data/ohlcv/$t.json" "$W/$t.json" --quiet
          done
          if ! aws s3 cp $S3FLAGS "$DST_ROOT/runs/pso_lssvm_v1/latest/next_session.parquet" "$W/ns.parquet" --quiet; then
            echo "::error::no latest/next_session.parquet — nothing to grade; run /quarterly-backtest first"
            exit 1
          fi
          python3 - "$W" <<'PY'
          import json, os, sys
          import pyarrow.parquet as pq
          w = sys.argv[1]
          want = len(json.load(open("tickers.json"))["stocks"])
          ns = pq.read_table(f"{w}/ns.parquet", columns=["as_of"]).column("as_of").to_pylist()
          as_of = str(max(ns))[:10]
          bar = max(json.load(open(f"{w}/{t}.json"))[-1]["date"] for t in ("AAPL", "MSFT", "AVGO"))[:10]
          print(f"stored: {len(ns)} guesses as_of {as_of} | newest bar on volume: {bar}")
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if len(ns) < want:
              print(f"::error::next_session.parquet has {len(ns)} rows, universe is {want} — "
                    "a limited run overwrote latest/; restore with `python3 -m src.merge --shards 20`")
              sys.exit(1)
          if bar <= as_of:
              print(f"::warning::no new bar yet (newest {bar}, stored as_of {as_of}) — not launching")
              out.write("launch=false\n")
          else:
              out.write("launch=true\n")
          PY

      - name: launch
        if: steps.gate.outputs.run == 'true' && steps.pre.outputs.launch == 'true'
        # EU-RO-1 capacity is often exhausted even after launch.sh's vCPU ladder and GPU fallback;
        # placement usually succeeds within a few tries. Retrying is safe: launch.sh skips a pod
        # whose name is already up.
        run: |
          for i in 1 2 3 4 5 6; do
            RUN_MODE=daily SHARDS=1 WATCHDOG_SEC=3600 bash scripts/launch.sh && exit 0
            echo "launch attempt $i failed — retrying in 60s"; sleep 60
          done
          echo "::error::no pod could be placed after 6 attempts"; exit 1

      # The pod deletes itself; this is the guarantee when it can't. It deletes a pod only after
      # reading that pod's own log and seeing the run finish, and reports a non-zero exit as FAILED.
      - name: reap pods
        if: always() && steps.gate.outputs.run == 'true' && steps.pre.outputs.launch == 'true'
        run: |
          scripts/reap_pods.sh --watch --until-empty --deadline 4500 | tee "$RUNNER_TEMP/reap.log"
          if grep -q 'FAILED' "$RUNNER_TEMP/reap.log"; then
            echo "::error::the daily run or its cleanup failed — see the reap log above and the pod log under _pod_logs/"
            exit 1
          fi

      - name: keep launch/reap logs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-logs-${{ github.run_id }}
          path: |
            launched-pods.log
            reaped-pods.log
          if-no-files-found: ignore
          retention-days: 14
